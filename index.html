<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Mercado</title>
  <style>
    /* RNF05: em tela estreita (360 px), os campos quebram linha em vez de sair da tela; nada de rolagem horizontal */
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 1rem auto; padding: 0 1rem; overflow-wrap: anywhere; }
    input, button { font: inherit; padding: .3rem; min-width: 0; }
    form, .item { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .item { border-bottom: 1px solid #ccc; padding: .5rem 0; }
    .nome { flex: 1 1 10rem; }
    .numero { width: 6rem; }
    #mensagem, #total { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Lista de Mercado</h1>
  <p id="mensagem"></p>

  <h2>Listas</h2>
  <!-- UC01: criar uma lista nova -->
  <form id="form-lista">
    <input id="nome-lista" class="nome" placeholder="Nome da nova lista">
    <button>Criar lista</button>
  </form>
  <!-- UC03: listas cadastradas; clique em uma para ver os itens -->
  <ul id="listas"></ul>

  <div id="area-itens" hidden>
    <h2 id="titulo-itens"></h2>
    <!-- UC02: adicionar um item à lista escolhida, com o preço em reais -->
    <form id="form-item">
      <input id="nome-item" class="nome" placeholder="Nome do item">
      <label>Qtd. <input id="quantidade-item" class="numero" type="number" value="1"></label>
      <label>Preço <input id="preco-item" class="numero" inputmode="decimal" placeholder="0,00"></label>
      <button>Adicionar item</button>
    </form>
    <!-- UC03: itens da lista escolhida; em cada um, Alterar (UC04) e Excluir (UC05) -->
    <div id="itens"></div>
    <!-- RF08: total da lista, atualizado depois de cada inclusão, alteração ou exclusão -->
    <p id="total"></p>
  </div>

  <script>
    let listaEscolhida = null;
    const mensagem = (texto) => { document.getElementById("mensagem").textContent = texto; };

    // D13: só a página converte entre reais (o que a pessoa digita e vê) e centavos (o que o sistema e o banco guardam).
    // Aceita vírgula ou ponto e o "R$" na frente. Multiplica por 100 e arredonda: 0,29 × 100 dá 28,999999999999996 → 29.
    function reaisParaCentavos(texto) {
      return Math.round(Number(texto.replace("R$", "").replace(",", ".")) * 100);
    }

    // Centavos para reais na tela: 1250 → "R$ 12,50".
    function centavosParaReais(centavos) {
      return "R$ " + (centavos / 100).toFixed(2).replace(".", ",");
    }

    // Chama uma rota do sistema; se der erro (por exemplo, 404), mostra a mensagem e para.
    async function chamar(metodo, caminho, corpo) {
      const resposta = await fetch(caminho, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: corpo === undefined ? undefined : JSON.stringify(corpo),
      });
      const dados = await resposta.json();
      if (!resposta.ok) {
        mensagem(dados.detail);
        throw new Error(dados.detail);
      }
      return dados;
    }

    // Cria um elemento da página; o texto entra com textContent, então nunca vira HTML.
    function elemento(tipo, propriedades) {
      return Object.assign(document.createElement(tipo), propriedades);
    }

    // Põe um campo dentro de um rótulo, como "Qtd. [6]".
    function rotulo(texto, campo) {
      const label = elemento("label", { textContent: texto + " " });
      label.append(campo);
      return label;
    }

    // UC03 (1ª rota): pede as listas e mostra cada uma como um botão.
    async function mostrarListas() {
      const ul = document.getElementById("listas");
      ul.replaceChildren();
      for (const lista of await chamar("GET", "/listas")) {
        const botao = elemento("button", { textContent: lista.nome, onclick: () => escolherLista(lista) });
        ul.append(elemento("li", {}));
        ul.lastChild.append(botao);
      }
    }

    // UC03 (2ª rota): pede os itens da lista escolhida e o total, e mostra os dois (RF08).
    async function escolherLista(lista) {
      listaEscolhida = lista;
      document.getElementById("area-itens").hidden = false;
      document.getElementById("titulo-itens").textContent = "Itens de " + lista.nome;
      const { itens, total } = await chamar("GET", `/listas/${lista.id}/itens`);
      document.getElementById("itens").replaceChildren(...itens.map(linhaDoItem));
      document.getElementById("total").textContent = "Total da lista: " + centavosParaReais(total);
    }

    // Monta a linha de um item: campos editáveis (o preço em reais) e os botões Alterar (UC04) e Excluir (UC05).
    function linhaDoItem(item) {
      const nome = elemento("input", { value: item.nome, className: "nome" });
      const quantidade = elemento("input", { type: "number", value: item.quantidade, className: "numero" });
      const preco = elemento("input", { value: centavosParaReais(item.preco), className: "numero", inputMode: "decimal" });
      const comprado = elemento("input", { type: "checkbox", checked: item.comprado });
      // UC04: envia o item com as mudanças, mostra o item atualizado e consulta de novo a lista e o total.
      const alterar = elemento("button", { textContent: "Alterar", onclick: async () => {
        const atualizado = await chamar("PUT", `/itens/${item.id}`, {
          nome: nome.value, quantidade: Number(quantidade.value),
          preco: reaisParaCentavos(preco.value), comprado: comprado.checked,
        });
        mensagem("Item atualizado: " + atualizado.nome);
        escolherLista(listaEscolhida);
      } });
      // UC05: pede a exclusão, mostra a confirmação e consulta de novo a lista e o total.
      const excluir = elemento("button", { textContent: "Excluir", onclick: async () => {
        mensagem((await chamar("DELETE", `/itens/${item.id}`)).mensagem);
        escolherLista(listaEscolhida);
      } });
      const linha = elemento("div", { className: "item" });
      linha.append(nome, rotulo("Qtd.", quantidade), rotulo("Preço", preco), rotulo("Comprado", comprado), alterar, excluir);
      return linha;
    }

    // UC01: cria a lista e mostra a lista criada.
    document.getElementById("form-lista").onsubmit = async (evento) => {
      evento.preventDefault();
      const campo = document.getElementById("nome-lista");
      const lista = await chamar("POST", "/listas", { nome: campo.value });
      campo.value = "";
      mensagem("Lista criada: " + lista.nome);
      await mostrarListas();
      escolherLista(lista);
    };

    // UC02: adiciona o item à lista escolhida, mostra o item criado e consulta de novo a lista e o total.
    document.getElementById("form-item").onsubmit = async (evento) => {
      evento.preventDefault();
      const nome = document.getElementById("nome-item");
      const quantidade = document.getElementById("quantidade-item");
      const preco = document.getElementById("preco-item");
      const item = await chamar("POST", `/listas/${listaEscolhida.id}/itens`,
        { nome: nome.value, quantidade: Number(quantidade.value), preco: reaisParaCentavos(preco.value) });
      nome.value = "";
      preco.value = "";
      mensagem("Item adicionado: " + item.nome);
      escolherLista(listaEscolhida);
    };

    mostrarListas();
  </script>
</body>
</html>
